[project]
name = "openlawai"
version = "0.1.0"
description = "Open-source AI-powered legal assistant with pluggable jurisdiction support."
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-dotenv>=1.0",
    "django>=5.2.8,<5.3",
    "adrf>=0.1.12",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "openai>=1.14",
    "djangorestframework>=3.15",
    "uvicorn>=0.32",
    "whitenoise>=6.11.0",
    "json-repair>=0.39",
    "tiktoken>=0.7",
    "pymupdf>=1.24",
    "weasyprint>=62",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.3",
    "weaviate-client>=4.18",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "redis>=5.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legal_pipeline*", "legaldb*", "chatdb*", "accounts*", "usage*", "agents*", "config*"]
